name: founderos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: founderos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-founderos}
      POSTGRES_DB: founderos
    volumes:
      - founderos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderos -d founderos"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      DATABASE_URL: postgresql://founderos:${POSTGRES_PASSWORD:-founderos}@db:5432/founderos
      PORT: "5000"
      BASE_PATH: /
      # Protect the instance. Leave empty only on a trusted network.
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Pick one AI provider (first configured wins; AI_PROVIDER forces one).
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      PUTER_AUTH_TOKEN: ${PUTER_AUTH_TOKEN:-}
      AI_EFFORT: ${AI_EFFORT:-}
      FOUNDER_NAME: ${FOUNDER_NAME:-}
      # Set to 1 to load a sample pipeline on first start (skipped if leads exist).
      SEED_DEMO: ${SEED_DEMO:-0}

volumes:
  founderos-db:

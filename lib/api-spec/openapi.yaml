  # ─── NOTIFICATIONS ────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"

  # ─── REPORTS ──────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      parameters:
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── ACTIVITIES ───────────────────────────────────────────────
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  # ─── REVENUE ──────────────────────────────────────────────────
  /revenue:
    get:
      operationId: listRevenue
      tags: [revenue]
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Revenue records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Revenue"
    post:
      operationId: createRevenue
      tags: [revenue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revenue"

  /revenue/summary:
    get:
      operationId: getRevenueSummary
      tags: [revenue]
      summary: Get revenue totals and projections
      responses:
        "200":
          description: Revenue summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueSummary"

  # ─── ONBOARDING ───────────────────────────────────────────────
  /onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
    patch:
      operationId: updateOnboarding
      tags: [onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"

  # ─── ORCHESTRATOR ─────────────────────────────────────────────
  /orchestrator/chat:
    post:
      operationId: orchestratorChat
      tags: [orchestrator]
      summary: Send message to Executive Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: EA response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /orchestrator/conversations:
    get:
      operationId: listOrchestratorConversations
      tags: [orchestrator]
      summary: List EA conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── DASHBOARD ──────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [activeProjects, openTasks, totalLeads, revenueThisMonth, activeAgents, unreadNotifications, urgentAlerts]
      properties:
        activeProjects:
          type: integer
        openTasks:
          type: integer
        totalLeads:
          type: integer
        revenueThisMonth:
          type: number
        activeAgents:
          type: integer
        unreadNotifications:
          type: integer
        urgentAlerts:
          type: integer
        projectsByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        tasksByPriority:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        leadsByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    DailyBriefing:
      type: object
      required: [date, summary, topPriorities, alerts, opportunities]
      properties:
        date:
          type: string
        summary:
          type: string
        topPriorities:
          type: array
          items:
            type: string
        alerts:
          type: array
          items:
            type: string

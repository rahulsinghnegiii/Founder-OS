<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope.woff2") format("woff2");
        font-weight: 200 800;
        font-display: block;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/space-grotesk.woff2") format("woff2");
        font-weight: 300 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f7f3ea;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Sub-comp slots stretch to fill the root. */
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- FounderOS README demo: hook → Sales Desk walkthrough → end card. 25s, loops. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1280" data-height="720">
      <div
        id="el-bg"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="25"
        data-track-index="0"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="el-hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="1"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="el-desk"
        data-composition-id="desk"
        data-composition-src="compositions/desk.html"
        data-start="2.9"
        data-duration="19.1"
        data-track-index="2"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="el-outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="21.7"
        data-duration="3.3"
        data-track-index="3"
        data-width="1280"
        data-height="720"
      ></div>
    </div>
    <script>
      // Orchestrator only: every scene animates on its own sub-composition timeline.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
